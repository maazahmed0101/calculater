<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screenContainer">0</div>
        <div class="buttonContainer">
            <button onclick="ClearDisplay()" class="clear">C</button>
            <button onclick="clicker('+')" class="yellow">+</button>
            <button onclick="clicker('1')">1</button>
            <button onclick="clicker('2')">2</button>
            <button onclick="clicker('3')">3</button>
            <button onclick="clicker('-')" class="yellow">-</button>
            <button onclick="clicker('4')">4</button>
            <button onclick="clicker('5')">5</button>
            <button onclick="clicker('6')">6</button>
            <button onclick="clicker('*')" class="yellow">*</button>
            <button onclick="clicker('7')">7</button>
            <button onclick="clicker('8')">8</button>
            <button onclick="clicker('9')">9</button>
            <button  onclick="clicker('/')"class="yellow">/</button>
            <button onclick="clicker('0')">0</button>
            <button onclick="clicker('.')">.</button>
            <button onclick="equalTo()" class="Blue">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
